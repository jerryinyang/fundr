[project]
name = "fundr"
version = "0.1.0"
description = "Cross-venue funding dynamics research"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "httpx",
    "lz4",
    "polars",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
